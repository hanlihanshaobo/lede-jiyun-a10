name: Build Jiyun A10 OpenWrt

on:
  workflow_dispatch:
    inputs:
      lede_repo:
        description: "Upstream LEDE repo"
        required: false
        default: "https://github.com/coolsnowwolf/lede"
      lede_ref:
        description: "Upstream branch/tag/commit"
        required: false
        default: "master"
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 5"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDE_REPO: ${{ github.event.inputs.lede_repo || 'https://github.com/coolsnowwolf/lede' }}
  LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: compile everything (toolchain + kernel + image).  Uploads the raw
  # pieces (kernel Image, device dtb, root.ext4, sysupgrade.img.gz) so the
  # FIT assembly below can run/fail/re-run independently of this slow job.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

      - name: Clone upstream LEDE
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "${LEDE_REF}" "${LEDE_REPO}" lede

      - name: Cache LEDE build tree
        uses: actions/cache@v4
        with:
          path: |
            lede/build_dir
            lede/staging_dir
            lede/dl
          key: jiyun-a10-lede-${{ github.run_id }}
          restore-keys: |
            jiyun-a10-lede-

      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          # The runner's apt mirrors are sometimes very slow; use short
          # timeouts + retries so a hung mirror fails fast instead of
          # blocking the whole job.
          sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 || echo "apt-get update failed, continuing"
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-pip rsync unzip zlib1g-dev \
            file wget curl libelf-dev

      - name: Inject Jiyun A10 device support
        run: |
          set -eux
          DTS_DIR=lede/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p "$DTS_DIR"
          cp files/rk3568-jiyun-a10.dts "$DTS_DIR/rk3568-jiyun-a10.dts"

          ARMV8_MK=lede/target/linux/rockchip/image/armv8.mk
          if ! grep -q "Device/jiyun_a10" "$ARMV8_MK"; then
            cat files/armv8-jiyun-a10.mk >> "$ARMV8_MK"
          fi

          # The generic kernel config fragment explicitly disables the
          # swconfig core and the RTL8367B driver, overriding .config - flip
          # those three lines so the switch driver is really built in.
          KCFG=lede/target/linux/generic/config-6.18
          sed -i \
            -e 's/^# CONFIG_SWCONFIG is not set/CONFIG_SWCONFIG=y/' \
            -e 's/^# CONFIG_RTL8366_SMI is not set/CONFIG_RTL8366_SMI=y/' \
            -e 's/^# CONFIG_RTL8367B_PHY is not set/CONFIG_RTL8367B_PHY=y/' \
            -e 's/^# CONFIG_NET_SWITCHDEV is not set/CONFIG_NET_SWITCHDEV=y/' \
            -e 's/^# CONFIG_NET_DSA is not set/CONFIG_NET_DSA=y/' \
            -e 's/^# CONFIG_NET_DSA_REALTEK is not set/CONFIG_NET_DSA_REALTEK=m/' \
            -e 's/^# CONFIG_NET_DSA_TAG_RTL8_4 is not set/CONFIG_NET_DSA_TAG_RTL8_4=m/' \
            "$KCFG"
          grep -E '^CONFIG_(SWCONFIG|RTL8366_SMI|RTL8367B_PHY|NET_DSA|NET_SWITCHDEV|NET_DSA_REALTEK|NET_DSA_TAG_RTL8_4)=' "$KCFG" || \
            { echo "ERROR: could not enable the switch driver in $KCFG"; exit 1; }

          # rootfs overlay: configure the RTL8367S switch (CPU port into the
          # LAN VLAN) - the rtl8367b swconfig driver does not do that itself
          UCI_DIR=lede/target/linux/rockchip/base-files/etc/uci-defaults
          mkdir -p "$UCI_DIR"
          cp files/99-jiyun-switch "$UCI_DIR/99-jiyun-switch"
          chmod +x "$UCI_DIR/99-jiyun-switch"
          # stable per-board MACs derived from the eMMC CID (the factory MACs
          # live in the WayOS config partition which mainline cannot read)
          cp files/99-jiyun-mac "$UCI_DIR/99-jiyun-mac"
          chmod +x "$UCI_DIR/99-jiyun-mac"

          # MT7916 needs an EEPROM blob; without it mt7915 probe fails and no
          # wlan phy is registered. Use the generic 4 KiB one from the
          # zhoufuli/immortalwrt-rk356x tree (same RK3568+MT7916 hardware).
          FW_DIR=lede/target/linux/rockchip/base-files/lib/firmware/mediatek
          mkdir -p "$FW_DIR"
          cp files/mt7916_eeprom.bin "$FW_DIR/mt7916_eeprom.bin"

      - name: Inject RTL8367S switch driver
        run: |
          set -eux
          # The RTL8367S support (compatible "realtek,rtl8367s", cpu_port 7)
          # is not in coolshowwolf/lede yet - take the updated, GPL-licensed
          # rtl8367b/rtl8367 driver from the working NSY G68 Plus tree.
          PHY_DIR=lede/target/linux/generic/files/drivers/net/phy
          INC_DIR=lede/target/linux/generic/files/include/linux
          BP_DIR=lede/target/linux/generic/backport-6.18
          mkdir -p "$PHY_DIR" "$INC_DIR" "$BP_DIR"
          cp kernel/files/drivers/net/phy/rtl8367.c "$PHY_DIR/"
          cp kernel/files/drivers/net/phy/rtl8367b.c "$PHY_DIR/"
          # rtl8366_smi needs the rwbts/rdbt helpers used by the RTL8367S driver
          cp kernel/files/drivers/net/phy/rtl8366_smi.c "$PHY_DIR/"
          cp kernel/files/drivers/net/phy/rtl8366_smi.h "$PHY_DIR/"
          cp kernel/files/include/linux/rtl8367.h "$INC_DIR/"
          cp kernel/backport-6.18/900-net-phy-add-rtl8367s.patch "$BP_DIR/"
          grep -n "rtl8367" "$PHY_DIR/Makefile" || true

      - name: Configure
        run: |
          set -eux
          cp configs/config.seed lede/.config
          cd lede
          make defconfig
          echo "== target/device =="
          grep -E "CONFIG_TARGET_(rockchip|.*jiyun_a10)" .config || true
          echo "== switch driver =="
          grep -E "CONFIG_RTL8367B_PHY" .config || echo "WARNING: RTL8367B_PHY not set!"

      - name: Download packages
        timeout-minutes: 60
        run: |
          cd lede
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build kernel (DTS check)
        run: |
          cd lede
          # NOTE: "make toolchain" is a no-op (it is a directory); the real
          # target that builds+installs the cross toolchain is toolchain/install
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Build
        run: |
          cd lede
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect build output
        run: |
          set -eux
          mkdir -p output
          KDIR=$(ls -d lede/build_dir/target-*/linux-rockchip_armv8/linux-* | head -1)
          ROOTDIR=$(ls -d lede/build_dir/target-*/linux-rockchip_armv8 | head -1)
          DTB=$(find "$ROOTDIR" -maxdepth 1 -name "image-rk3568-jiyun-a10.dtb" | head -1)
          [ -n "$DTB" ] || DTB=$(find "$ROOTDIR" -maxdepth 1 -name "*jiyun*.dtb" | head -1)
          test -f "$DTB" || { echo "DTB not found under $ROOTDIR:"; ls -la "$ROOTDIR" | head; exit 1; }
          if [ ! -f "$ROOTDIR/Image" ]; then
            [ -f "$KDIR/Image" ] || { echo "Image not found under $KDIR"; exit 1; }
            IMG="$ROOTDIR/Image"
          else
            IMG="$ROOTDIR/Image"
          fi
          test -f "$ROOTDIR/root.ext4" || { echo "root.ext4 not found under $ROOTDIR"; exit 1; }
          cp -v "$DTB" output/rockchip.dtb
          cp -v "$IMG" output/Image
          cp -v "$ROOTDIR/root.ext4" output/root.ext4
          find lede/bin/targets -type f \
            \( -name "*jiyun*" -o -name "*.manifest" -o -name "sha256sums" \
               -o -name "packages.tar" -o -name "*.config" \) \
            -exec cp -v {} output/ \; || true
          ls -al output

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Job 2: assemble the SPI NOR bootstrap FIT from the build output.  This is
  # deliberately split out so that a FIT bug only needs this (fast) job to be
  # re-run, instead of the whole 1.5 h build.
  # -------------------------------------------------------------------------
  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: output

      - name: Assemble SPI NOR bootstrap FIT
        run: |
          set -eux
          test -f output/Image || { echo "Image missing"; exit 1; }
          test -f output/rockchip.dtb || { echo "dtb missing"; exit 1; }
          test -f output/root.ext4 || { echo "root.ext4 missing"; exit 1; }
          cp output/Image /tmp/Image
          cp output/rockchip.dtb /tmp/rockchip.dtb

          # Build the FIT by patching the *stock* FIT header (same property
          # layout, only sizes/hashes/positions change).
          #
          # NOTE: do NOT use "mkimage -E": it emits the new "data-offset"
          # property, while the stock Rockchip SDK u-boot of this router
          # (2017.09-dirty) only understands the old "data-position" one -
          # it would fail with "Could not find kernel subimage data!".
          python3 tools/mkfit.py files/stock_fit_header.bin \
            /tmp/Image /tmp/rockchip.dtb output/jiyun-a10-openwrt.fit
          ls -l output/jiyun-a10-openwrt.fit

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jiyun-a10-openwrt
          path: |
            output/jiyun-a10-openwrt.fit
            output/rockchip.dtb
            output/root.ext4
          retention-days: 30
          if-no-files-found: error
