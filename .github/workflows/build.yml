name: Build Jiyun A10 OpenWrt

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Flash packages to build"
        type: choice
        options:
          - emmc
          - spi
          - both
        default: emmc
      lede_repo:
        description: "Upstream LEDE repo"
        required: false
        default: "https://github.com/coolsnowwolf/lede"
      lede_ref:
        description: "Upstream branch/tag/commit (branch or 40-char sha)"
        required: false
        default: "cc4d5400d29734c1133423b1e45258fcb0dddf8d"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 18 * * 5"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDE_REPO: ${{ github.event.inputs.lede_repo || 'https://github.com/coolsnowwolf/lede' }}
  # Pinned to the last upstream tree that built: LEDE master moves daily and
  # backports in target/linux/generic/{backport,pending}-6.18 keep breaking the
  # kernel-headers step (#47-#51). prepare.sh still has to drop the patch
  # series for hardware this board does not have - see the comment there.
  # Pass "master" manually to track upstream, and expect new breakage.
  LEDE_REF: ${{ github.event.inputs.lede_ref || 'cc4d5400d29734c1133423b1e45258fcb0dddf8d' }}
  # push / schedule build both packages for now, to get a complete set into the
  # latest release; switch the fallback to 'emmc' once the SPI package is
  # validated, since only the rootfs gets iterated on afterwards.
  PACKAGES: ${{ github.event.inputs.packages || 'both' }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: compile everything (toolchain + kernel + rootfs) and upload only the
  # pieces the packaging jobs need, so an eMMC-only run does not pay for the
  # 40 MB kernel Image or for the FIT.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-22.04
    # NOTE: env is not available in a job-level `if`, so the resolved package
    # selection is re-exported as a job output for the packaging jobs below.
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Plan
        id: plan
        run: |
          case "$PACKAGES" in
            emmc|spi|both) ;;
            *) echo "unknown packages: $PACKAGES"; exit 1 ;;
          esac
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "building: $PACKAGES"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

      - name: Clone upstream LEDE
        run: |
          set -eux
          # LEDE_REF is usually a 40-char commit sha (reproducible builds); a
          # branch name still works, e.g. lede_ref=master to track upstream.
          if [ "${#LEDE_REF}" -eq 40 ] && [ -z "$(printf '%s' "$LEDE_REF" | tr -d '0-9a-f')" ]; then
            echo "pinned upstream commit: $LEDE_REF"
            git init -q lede
            git -C lede remote add origin "$LEDE_REPO"
            git -C lede fetch --depth 1 origin "$LEDE_REF"
            git -C lede checkout -q FETCH_HEAD
            git -C lede submodule update --init --recursive --depth 1
          else
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              --branch "${LEDE_REF}" "${LEDE_REPO}" lede
          fi
          git -C lede log --oneline -1

      # NOTE: no build cache on purpose. Builds are infrequent now that the
      # port works, and restoring build_dir/staging_dir can hide upstream
      # changes behind stale stamp files. A clean build is the cheaper trade:
      # nothing in bin/targets is cached either, so every image is generated
      # from scratch anyway.
      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          # The runner's apt mirrors are sometimes very slow; use short
          # timeouts + retries so a hung mirror fails fast instead of
          # blocking the whole job.
          sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 || echo "apt-get update failed, continuing"
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-pip rsync unzip zlib1g-dev \
            file wget curl libelf-dev

      - name: Inject Jiyun A10 device support
        run: ./scripts/prepare.sh lede

      - name: Configure
        run: |
          set -eux
          cp configs/config.seed lede/.config
          cd lede
          make defconfig
          echo "== target/device =="
          grep -E "CONFIG_TARGET_(rockchip|.*jiyun_a10)" .config || true
          echo "== switch driver =="
          # .config carries no kernel symbols (the old CONFIG_RTL8367B_PHY check
          # could never pass); the switch is the mainline DSA driver, so assert
          # the kmod that DEVICE_PACKAGES pulls in. Both checks are hard errors:
          # without them the image builds fine but ends up without LAN.
          grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_jiyun_a10=y$' .config \
            || { echo "ERROR: device jiyun_a10 not selected - did prepare.sh fail to append the recipe?"; exit 1; }
          grep -q '^CONFIG_PACKAGE_kmod-dsa-rtl8365mb=y$' .config \
            || { echo "ERROR: kmod-dsa-rtl8365mb not selected - the image would have no switch driver"; exit 1; }

          # Branding/application packages come from DEVICE_PACKAGES. A typo in
          # that list is silently dropped by defconfig, so assert every symbol
          # here: a build without the default theme or OpenClash would still
          # succeed and only be noticed after flashing.
          for sym in \
            CONFIG_PACKAGE_luci-theme-design \
            CONFIG_PACKAGE_luci-theme-argon \
            CONFIG_PACKAGE_luci-app-openclash \
            CONFIG_PACKAGE_luci-app-zerotier \
            CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy \
            CONFIG_PACKAGE_dnsmasq-full \
            CONFIG_PACKAGE_xray-core \
            CONFIG_PACKAGE_sing-box \
            CONFIG_PACKAGE_luci-app-emmc-health \
            CONFIG_PACKAGE_mmc-utils \
            CONFIG_PACKAGE_v2ray-geoip \
            CONFIG_PACKAGE_v2ray-geosite \
            CONFIG_PACKAGE_zerotier \
            CONFIG_PACKAGE_luci-app-qmodem-next \
            CONFIG_PACKAGE_qmodem \
            CONFIG_PACKAGE_luci-app-diskman \
            CONFIG_PACKAGE_resize2fs; do
            grep -q "^${sym}=y$" .config \
              || { echo "ERROR: ${sym} not selected - check DEVICE_PACKAGES"; exit 1; }
          done
          echo "jiyun_a10 + switch + branding packages OK"

      # Apply the kernel patch series on its own, before the 40+ minute build.
      # A stale upstream patch used to surface ~30 minutes into "Build", behind
      # a log that needs a GitHub login; here the same failure is a few minutes
      # in, with the patch output in the step log (#47-#52 were all this).
      - name: Preflight kernel patches
        timeout-minutes: 30
        run: |
          cd lede
          set -o pipefail
          if make target/linux/prepare V=s 2>&1 | tee /tmp/kernel-prepare.log; then
            echo "all kernel patches applied"
            exit 0
          fi

          { echo '### kernel patches failed'; echo '```'
            grep -B9 -m1 '\*\*\* \[' /tmp/kernel-prepare.log || tail -20 /tmp/kernel-prepare.log
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          grep -B9 -m1 '\*\*\* \[' /tmp/kernel-prepare.log > /tmp/ctx || tail -12 /tmp/kernel-prepare.log > /tmp/ctx
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}"
          done < /tmp/ctx
          exit 1

      - name: Download packages
        timeout-minutes: 60
        run: |
          cd lede
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build
        run: |
          cd lede
          set -o pipefail
          # One "make" walks tools -> toolchain -> target/linux -> packages ->
          # images in dependency order. Driving the stages by hand is fragile on
          # a clean tree: it only ever worked because a cached staging_dir was
          # always present, and #47/#48 both died in toolchain/install.
          if make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            exit 0
          fi

          echo "::warning::parallel build failed, retrying serially for a readable error"
          make -j1 V=s 2>&1 | tee /tmp/build-serial.log || true

          {
            echo "### build failed"
            echo '```'
            tail -60 /tmp/build-serial.log
            echo '```'
            echo
            echo "### disk"
            echo '```'
            df -h / || true
            du -sh build_dir staging_dir dl 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The job log needs a GitHub login; error annotations do not, so put
          # the context around the first hard failure into the UI. The line
          # before "*** [...]" is usually the patch/gcc invocation that broke.
          CTX=$(grep -B9 -m1 '\*\*\* \[' /tmp/build-serial.log || true)
          [ -n "$CTX" ] || CTX=$(tail -12 /tmp/build-serial.log)
          printf '%s\n' "$CTX" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}"
          done
          exit 1

      - name: Collect build output
        run: |
          set -eux
          mkdir -p output
          case "$PACKAGES" in
            emmc) WANT_EMMC=1; WANT_KERNEL=0 ;;
            spi)  WANT_EMMC=0; WANT_KERNEL=1 ;;
            both) WANT_EMMC=1; WANT_KERNEL=1 ;;
            *) echo "unknown packages: $PACKAGES"; exit 1 ;;
          esac
          echo "packages=$PACKAGES emmc=$WANT_EMMC kernel=$WANT_KERNEL"

          ROOTDIR=$(ls -d lede/build_dir/target-*/linux-rockchip_armv8 | head -1)

          if [ "$WANT_KERNEL" = 1 ]; then
            DTB=$(find "$ROOTDIR" -maxdepth 1 -name "image-rk3568-jiyun-a10.dtb" | head -1)
            [ -n "$DTB" ] || DTB=$(find "$ROOTDIR" -maxdepth 1 -name "*jiyun*.dtb" | head -1)
            test -f "$DTB" || { echo "DTB not found under $ROOTDIR:"; ls -la "$ROOTDIR" | head; exit 1; }
            test -f "$ROOTDIR/Image" || { echo "Image not found under $ROOTDIR"; exit 1; }
            cp -v "$DTB" output/rockchip.dtb
            cp -v "$ROOTDIR/Image" output/Image
            # lets whoever compares two runs see whether the kernel changed
            sha256sum output/Image | tee output/kernel.sha256
          fi

          # rboot helper: lets the running system request loader/maskrom.
          RB=$(find lede/build_dir/target-*/rboot -maxdepth 1 -name rboot -type f | head -1)
          if [ -n "$RB" ]; then
            cp -v "$RB" output/rboot
            sha256sum output/rboot
          fi

          if [ "$WANT_EMMC" = 1 ]; then
            # produced by Build/jiyun-a10-emmc-img. image.mk names it
            #   openwrt-rockchip-armv8-jiyun_a10-<fs>-<image>
            # i.e. "-ext4-emmc.img", and appends ".gz" because the rootfs
            # filesystem is ext4 and CONFIG_TARGET_IMAGES_GZIP is on (#53 died
            # here: the old pattern only matched "*jiyun*-emmc.img").
            EMMC=$(find lede/bin/targets -name "*jiyun*emmc.img*" | head -1)
            test -n "$EMMC" || { echo "emmc.img was not produced"; \
              find lede/bin/targets -type f; exit 1; }
            echo "emmc image: $EMMC"
            # hand the packaging job a plain image, so its contract check can
            # read the MBR without knowing how image.mk compressed it
            case "$EMMC" in
              *.gz) gunzip -c "$EMMC" > output/jiyun-a10-emmc.img ;;
              *)    cp -v "$EMMC" output/jiyun-a10-emmc.img ;;
            esac
            test "$(wc -c < output/jiyun-a10-emmc.img | tr -d ' ')" -gt 268435456 \
              || { echo "emmc.img is too small: $(wc -c < output/jiyun-a10-emmc.img)"; exit 1; }
          fi
          ls -al output

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Job 2a: eMMC package - MBR + root.ext4, written with `wl 0` in loader mode.
  # Runs on every push/schedule; skipped when only the SPI package is wanted.
  # -------------------------------------------------------------------------
  pack-emmc:
    needs: build
    if: ${{ needs.build.outputs.packages != 'spi' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: output

      - name: Contract check
        run: |
          set -eux
          test -f output/jiyun-a10-emmc.img
          # Flashing relies on exactly this layout: 1 MiB reserved, p1 @ LBA 2048.
          test "$(wc -c < output/jiyun-a10-emmc.img | tr -d ' ')" -gt 268435456
          python3 - <<'PY'
          m = open('output/jiyun-a10-emmc.img', 'rb').read(512)
          assert m[510:512] == b'\x55\xaa', 'MBR signature missing'
          assert int.from_bytes(m[454:458], 'little') == 2048, 'p1 must start at LBA 2048'
          assert m[450] == 0x83, 'p1 must be type 0x83 (Linux)'
          print('emmc layout OK')
          PY

      - name: Upload eMMC package
        uses: actions/upload-artifact@v4
        with:
          name: jiyun-a10-emmc
          path: output/jiyun-a10-emmc.img
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Job 2b: SPI package - loader + u-boot + FIT, written with `wl 0` in
  # maskrom. Only rebuilt on demand: it carries the kernel, so it must be
  # refreshed whenever the kernel / DTS / device recipe changes, otherwise the
  # kmods in a newer eMMC rootfs will not match.
  # -------------------------------------------------------------------------
  pack-spi:
    needs: build
    if: ${{ needs.build.outputs.packages == 'spi' || needs.build.outputs.packages == 'both' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: output

      - name: Assemble SPI NOR bootstrap FIT
        run: |
          set -eux
          test -f output/Image || { echo "Image missing"; exit 1; }
          test -f output/rockchip.dtb || { echo "dtb missing"; exit 1; }
          cp output/Image /tmp/Image
          cp output/rockchip.dtb /tmp/rockchip.dtb

          # Build the FIT by patching the *stock* FIT header (same property
          # layout, only sizes/hashes/positions change).
          #
          # NOTE: do NOT use "mkimage -E": it emits the new "data-offset"
          # property, while the stock Rockchip SDK u-boot of this router
          # (2017.09-dirty) only understands the old "data-position" one -
          # it would fail with "Could not find kernel subimage data!".
          python3 tools/mkfit.py files/stock_fit_header.bin \
            /tmp/Image /tmp/rockchip.dtb output/jiyun-a10-openwrt.fit
          ls -l output/jiyun-a10-openwrt.fit

      - name: Assemble SPI NOR flashing image
        run: |
          set -eux
          # Stock loader (0x0) + stock u-boot (0x100000) + OpenWrt FIT (0x300000),
          # i.e. the whole boot chain in one 8.6 MiB file. It fits the maskrom
          # 32 MiB write window, so a completely blank SPI NOR can be flashed
          # without a loader being present beforehand.
          python3 tools/mk-spi-img.py files/stock_loader.bin files/stock_uboot.bin \
            output/jiyun-a10-openwrt.fit output/jiyun-a10-spi.img
          ls -l output/jiyun-a10-spi.img

      - name: Contract check
        run: |
          set -eux
          # Downstream flashing relies on these exact offsets.
          python3 - <<'PY'
          d = open('output/jiyun-a10-spi.img', 'rb').read()
          assert d[0x100000:0x100004] == b'\xd0\r\xfe\xed', 'u-boot FIT missing @0x100000'
          assert d[0x300000:0x300004] == b'\xd0\r\xfe\xed', 'kernel FIT missing @0x300000'
          print('spi layout OK')
          PY

      - name: Upload SPI package
        uses: actions/upload-artifact@v4
        with:
          name: jiyun-a10-spi
          path: output/jiyun-a10-spi.img
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Job 3: publish to the rolling "latest" release. The release always keeps
  # both assets; an eMMC-only run overwrites just the eMMC one, so the SPI
  # package stays downloadable until it is rebuilt on purpose.
  # -------------------------------------------------------------------------
  release:
    needs: [build, pack-emmc, pack-spi]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jiyun-a10-*
          merge-multiple: true

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ls -l dist

          IMGS=$(ls dist/*.img 2>/dev/null || true)
          [ -n "$IMGS" ] || { echo "nothing to publish"; exit 1; }

          KERNEL_SHA=$(awk '{print $1}' build-output/kernel.sha256 2>/dev/null || true)
          [ -n "$KERNEL_SHA" ] || KERNEL_SHA="(not captured: eMMC-only run)"

          size() { wc -c < "$1" | tr -d ' '; }
          fmt() { echo "$(($1 / 1048576)) MiB"; }
          SPI_SIZE="not rebuilt"; EMMC_SIZE="not rebuilt"
          if [ -f dist/jiyun-a10-spi.img ]; then
            SPI_SIZE=$(fmt "$(size dist/jiyun-a10-spi.img)")
          fi
          if [ -f dist/jiyun-a10-emmc.img ]; then
            EMMC_SIZE=$(fmt "$(size dist/jiyun-a10-emmc.img)")
          fi

          cat > notes.md <<EOF
          Rolling release: the two files below always hold the newest build.
          Assets not rebuilt in a given run are left untouched.

          | File | Size | Write to | Command |
          |------|------|----------|---------|
          | \`jiyun-a10-spi.img\`  | ${SPI_SIZE}  | SPI NOR | \`wl 0\` (works in maskrom) |
          | \`jiyun-a10-emmc.img\` | ${EMMC_SIZE} | eMMC    | \`wl 0\` (loader mode only) |

          \`\`\`sh
          RKD=./tools/rkdeveloptool
          \$RKD ld && \$RKD cs 9 && \$RKD wl 0 jiyun-a10-spi.img    # maskrom: boot chain
          # power-cycle, hold RESET -> loader mode
          \$RKD ld && \$RKD cs 1 && \$RKD wl 0 jiyun-a10-emmc.img   # loader: rootfs
          \`\`\`

          - kernel sha256: \`${KERNEL_SHA}\`
          - built from: ${GITHUB_SHA} (${PACKAGES})
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          **The SPI package carries the kernel.** Rebuild it (\`packages: both\`)
          whenever the kernel, DTS, device recipe or upstream LEDE revision
          changes - an eMMC rootfs flashed against an older SPI package will
          have kmods that do not match the running kernel.
          EOF

          # This job never checks out the tree, so gh has no git remote to infer
          # the repository from: every call needs an explicit --repo, otherwise
          # it dies with "failed to run git: fatal: not a git repository" (#54).
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest $IMGS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" \
              --title "Jiyun A10 — latest firmware" \
              --notes-file notes.md --latest
          else
            gh release create latest $IMGS --repo "$GITHUB_REPOSITORY" \
              --title "Jiyun A10 — latest firmware" \
              --notes-file notes.md --latest
          fi

          echo "published:"
          gh release view latest --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
