name: Build Jiyun A10 OpenWrt

on:
  workflow_dispatch:
    inputs:
      lede_repo:
        description: "Upstream LEDE repo"
        required: false
        default: "https://github.com/coolsnowwolf/lede"
      lede_ref:
        description: "Upstream branch/tag/commit"
        required: false
        default: "master"
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 5"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDE_REPO: ${{ github.event.inputs.lede_repo || 'https://github.com/coolsnowwolf/lede' }}
  LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

      - name: Clone upstream LEDE
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "${LEDE_REF}" "${LEDE_REPO}" lede

      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-pip rsync unzip zlib1g-dev \
            file wget curl libelf-dev

      - name: Inject Jiyun A10 device support
        run: |
          set -eux
          DTS_DIR=lede/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p "$DTS_DIR"
          cp files/rk3568-jiyun-a10.dts "$DTS_DIR/rk3568-jiyun-a10.dts"

          ARMV8_MK=lede/target/linux/rockchip/image/armv8.mk
          if ! grep -q "Device/jiyun_a10" "$ARMV8_MK"; then
            cat files/armv8-jiyun-a10.mk >> "$ARMV8_MK"
          fi

      - name: Configure
        run: |
          set -eux
          cp configs/config.seed lede/.config
          cd lede
          make defconfig
          echo "== target/device =="
          grep -E "CONFIG_TARGET_(rockchip|.*jiyun_a10)" .config || true

      - name: Download packages
        run: |
          cd lede
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build kernel (DTS check)
        run: |
          cd lede
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Build
        run: |
          cd lede
          make -j"$(nproc)" || make -j1 V=s

      - name: Build SPI NOR FIT image (for Rockchip uboot boot_android flow)
        run: |
          set -eux
          sudo apt-get install -y u-boot-tools
          cd lede
          KDIR=$(ls -d build_dir/target-*/linux-rockchip_armv8/linux-* | head -1)
          DTB="$KDIR/arch/arm64/boot/dts/rockchip/image-rk3568-jiyun-a10.dtb"
          IMG=$(ls -1 "$KDIR"/Image 2>/dev/null | head -1)
          test -f "$DTB" || { echo "DTB not found: $DTB"; exit 1; }
          test -f "$IMG" || { echo "Image not found in $KDIR"; exit 1; }
          cp "$DTB" /tmp/rockchip.dtb
          cp "$IMG" /tmp/Image
          cat > /tmp/jiyun.its <<'ITS'
          /dts-v1/;
          / {
              description = "Jiyun A10 OpenWrt FIT";
              #address-cells = <1>;

              images {
                  kernel {
                      description = "Linux kernel";
                      data = /incbin/("/tmp/Image");
                      type = "kernel";
                      arch = "arm64";
                      os = "linux";
                      compression = "none";
                      load = <0x00280000>;
                      entry = <0x00280000>;
                      hash { algo = "sha256"; };
                  };
                  fdt {
                      description = "Device Tree Blob";
                      data = /incbin/("/tmp/rockchip.dtb");
                      type = "flat_dt";
                      arch = "arm64";
                      compression = "none";
                      hash { algo = "sha256"; };
                  };
              };

              configurations {
                  default = "conf";
                  conf {
                      description = "OpenWrt Jiyun A10";
                      kernel = "kernel";
                      fdt = "fdt";
                      hash { algo = "sha256"; };
                  };
              };
          };
          ITS
          mkimage -f /tmp/jiyun.its /tmp/jiyun-a10-openwrt.fit
          ls -l /tmp/jiyun-a10-openwrt.fit

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p output
          find lede/bin/targets -type f \
            \( -name "*jiyun*" -o -name "*.manifest" -o -name "sha256sums" \
               -o -name "packages.tar" -o -name "*.config" \) \
            -exec cp -v {} output/ \; || true
          cp -v /tmp/jiyun-a10-openwrt.fit output/ || true
          cp -v /tmp/rockchip.dtb output/ || true
          ls -al output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jiyun-a10-openwrt
          path: output
          retention-days: 30
          if-no-files-found: warn
