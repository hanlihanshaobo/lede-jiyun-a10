name: Build Jiyun A10 OpenWrt

on:
  workflow_dispatch:
    inputs:
      lede_repo:
        description: "Upstream LEDE repo"
        required: false
        default: "https://github.com/coolsnowwolf/lede"
      lede_ref:
        description: "Upstream branch/tag/commit"
        required: false
        default: "master"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 18 * * 5"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDE_REPO: ${{ github.event.inputs.lede_repo || 'https://github.com/coolsnowwolf/lede' }}
  LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: compile everything (toolchain + kernel + image).  Uploads the raw
  # pieces (kernel Image, device dtb, root.ext4, sysupgrade.img.gz) so the
  # FIT assembly below can run/fail/re-run independently of this slow job.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

      - name: Clone upstream LEDE
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "${LEDE_REF}" "${LEDE_REPO}" lede

      - name: Cache LEDE build tree
        uses: actions/cache@v4
        with:
          path: |
            lede/build_dir
            lede/staging_dir
            lede/dl
          key: jiyun-a10-lede-${{ github.run_id }}
          restore-keys: |
            jiyun-a10-lede-

      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          # The runner's apt mirrors are sometimes very slow; use short
          # timeouts + retries so a hung mirror fails fast instead of
          # blocking the whole job.
          sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 || echo "apt-get update failed, continuing"
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-pip rsync unzip zlib1g-dev \
            file wget curl libelf-dev

      - name: Inject Jiyun A10 device support
        run: ./scripts/prepare.sh lede

      - name: Configure
        run: |
          set -eux
          cp configs/config.seed lede/.config
          cd lede
          make defconfig
          echo "== target/device =="
          grep -E "CONFIG_TARGET_(rockchip|.*jiyun_a10)" .config || true
          echo "== switch driver =="
          grep -E "CONFIG_RTL8367B_PHY" .config || echo "WARNING: RTL8367B_PHY not set!"

      - name: Download packages
        timeout-minutes: 60
        run: |
          cd lede
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build kernel (DTS check)
        run: |
          cd lede
          # NOTE: "make toolchain" is a no-op (it is a directory); the real
          # target that builds+installs the cross toolchain is toolchain/install
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Build
        run: |
          cd lede
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect build output
        run: |
          set -eux
          mkdir -p output
          KDIR=$(ls -d lede/build_dir/target-*/linux-rockchip_armv8/linux-* | head -1)
          ROOTDIR=$(ls -d lede/build_dir/target-*/linux-rockchip_armv8 | head -1)
          DTB=$(find "$ROOTDIR" -maxdepth 1 -name "image-rk3568-jiyun-a10.dtb" | head -1)
          [ -n "$DTB" ] || DTB=$(find "$ROOTDIR" -maxdepth 1 -name "*jiyun*.dtb" | head -1)
          test -f "$DTB" || { echo "DTB not found under $ROOTDIR:"; ls -la "$ROOTDIR" | head; exit 1; }
          if [ ! -f "$ROOTDIR/Image" ]; then
            [ -f "$KDIR/Image" ] || { echo "Image not found under $KDIR"; exit 1; }
            IMG="$ROOTDIR/Image"
          else
            IMG="$ROOTDIR/Image"
          fi
          test -f "$ROOTDIR/root.ext4" || { echo "root.ext4 not found under $ROOTDIR"; exit 1; }
          cp -v "$DTB" output/rockchip.dtb
          cp -v "$IMG" output/Image
          cp -v "$ROOTDIR/root.ext4" output/root.ext4

          # eMMC flashing package, produced by Build/jiyun-a10-emmc-img
          EMMC=$(find lede/bin/targets -name "*jiyun*-emmc.img" | head -1)
          test -n "$EMMC" || { echo "emmc.img was not produced"; \
            find lede/bin/targets -type f; exit 1; }
          cp -v "$EMMC" output/jiyun-a10-emmc.img
          ls -al output

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Job 2: turn the build output into the two flashing packages.  This is
  # deliberately split out so that a packaging bug only needs this (fast) job to
  # be re-run, instead of the whole 1.5 h build.
  #
  #   jiyun-a10-spi.img    loader + u-boot + FIT   -> `wl 0` on SPI NOR
  #   jiyun-a10-emmc.img   MBR + root.ext4         -> `wl 0` on eMMC
  # -------------------------------------------------------------------------
  assemble:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: output

      - name: Assemble SPI NOR bootstrap FIT
        run: |
          set -eux
          test -f output/Image || { echo "Image missing"; exit 1; }
          test -f output/rockchip.dtb || { echo "dtb missing"; exit 1; }
          test -f output/root.ext4 || { echo "root.ext4 missing"; exit 1; }
          cp output/Image /tmp/Image
          cp output/rockchip.dtb /tmp/rockchip.dtb

          # Build the FIT by patching the *stock* FIT header (same property
          # layout, only sizes/hashes/positions change).
          #
          # NOTE: do NOT use "mkimage -E": it emits the new "data-offset"
          # property, while the stock Rockchip SDK u-boot of this router
          # (2017.09-dirty) only understands the old "data-position" one -
          # it would fail with "Could not find kernel subimage data!".
          python3 tools/mkfit.py files/stock_fit_header.bin \
            /tmp/Image /tmp/rockchip.dtb output/jiyun-a10-openwrt.fit
          ls -l output/jiyun-a10-openwrt.fit

      - name: Assemble SPI NOR flashing image
        run: |
          set -eux
          # Stock loader (0x0) + stock u-boot (0x100000) + OpenWrt FIT (0x300000),
          # i.e. the whole boot chain in one 8.6 MiB file. It fits the maskrom
          # 32 MiB write window, so a completely blank SPI NOR can be flashed
          # without a loader being present beforehand.
          python3 tools/mk-spi-img.py files/stock_loader.bin files/stock_uboot.bin \
            output/jiyun-a10-openwrt.fit output/jiyun-a10-spi.img
          ls -l output/jiyun-a10-spi.img

      - name: Contract check
        run: |
          set -eux
          test -f output/jiyun-a10-spi.img
          test -f output/jiyun-a10-emmc.img
          # Downstream flashing relies on these exact offsets.
          test "$(stat -c%s output/jiyun-a10-emmc.img)" -gt 268435456
          python3 - <<'PY'
          d = open('output/jiyun-a10-spi.img', 'rb').read()
          assert d[0x100000:0x100004] == b'\xd0\r\xfe\xed', 'u-boot FIT missing @0x100000'
          assert d[0x300000:0x300004] == b'\xd0\r\xfe\xed', 'kernel FIT missing @0x300000'
          m = open('output/jiyun-a10-emmc.img', 'rb').read(512)
          assert m[510:512] == b'\x55\xaa', 'MBR signature missing'
          assert int.from_bytes(m[454:458], 'little') == 2048, 'p1 must start at LBA 2048'
          print('spi/emmc package layout OK')
          PY

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jiyun-a10-flash
          path: |
            output/jiyun-a10-spi.img
            output/jiyun-a10-emmc.img
          retention-days: 30
          if-no-files-found: error
