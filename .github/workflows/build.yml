name: Build Jiyun A10 OpenWrt

on:
  workflow_dispatch:
    inputs:
      lede_repo:
        description: "Upstream LEDE repo"
        required: false
        default: "https://github.com/coolsnowwolf/lede"
      lede_ref:
        description: "Upstream branch/tag/commit"
        required: false
        default: "master"
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 5"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDE_REPO: ${{ github.event.inputs.lede_repo || 'https://github.com/coolsnowwolf/lede' }}
  LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

      - name: Clone upstream LEDE
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "${LEDE_REF}" "${LEDE_REPO}" lede

      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-pip rsync unzip zlib1g-dev \
            file wget curl libelf-dev

      - name: Inject Jiyun A10 device support
        run: |
          set -eux
          DTS_DIR=lede/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p "$DTS_DIR"
          cp files/rk3568-jiyun-a10.dts "$DTS_DIR/rk3568-jiyun-a10.dts"

          ARMV8_MK=lede/target/linux/rockchip/image/armv8.mk
          if ! grep -q "Device/jiyun_a10" "$ARMV8_MK"; then
            cat files/armv8-jiyun-a10.mk >> "$ARMV8_MK"
          fi

      - name: Configure
        run: |
          set -eux
          cp configs/config.seed lede/.config
          cd lede
          make defconfig
          echo "== target/device =="
          grep -E "CONFIG_TARGET_(rockchip|.*jiyun_a10)" .config || true

      - name: Download packages
        run: |
          cd lede
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build kernel (DTS check)
        run: |
          cd lede
          make toolchain -j"$(nproc)" || make toolchain -j1 V=s
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Build
        run: |
          cd lede
          make -j"$(nproc)" || make -j1 V=s

      - name: Build SPI NOR FIT image (Rockchip uboot boot_android flow)
        run: |
          set -eux
          sudo apt-get install -y u-boot-tools device-tree-compiler
          cd lede
          KDIR=$(ls -d build_dir/target-*/linux-rockchip_armv8/linux-* | head -1)
          TGT=$(ls -d staging_dir/target-aarch64_generic_musl | head -1)
          DTB="$KDIR/arch/arm64/boot/dts/rockchip/image-rk3568-jiyun-a10.dtb"
          IMG="$KDIR/Image"
          test -f "$DTB" || { echo "DTB not found: $DTB"; exit 1; }
          test -f "$IMG" || { echo "Image not found: $IMG"; exit 1; }
          cp "$DTB" /tmp/rockchip.dtb
          cp "$IMG" /tmp/Image

          # ---- bootargs for stage 1 (initramfs provides the rootfs) ----
          fdtput -t s /tmp/rockchip.dtb /chosen bootargs "console=ttyS2,1500000 earlycon=pl011,0xfe660000"

          # ---- LZMA-compress the kernel, same as the original stock FIT ----
          lzma -9 -c /tmp/Image > /tmp/Image.lzma
          ls -l /tmp/Image /tmp/Image.lzma

          # ---- stage 1: minimal busybox initramfs (small enough to fit the
          #      27 MB "Kernel" partition together with the LZMA kernel) ----
          rm -rf /tmp/s1
          mkdir -p /tmp/s1/bin /tmp/s1/dev /tmp/s1/proc /tmp/s1/sys /tmp/s1/lib /tmp/s1/tmp /tmp/s1/etc
          cp "$TGT"/bin/busybox /tmp/s1/bin/busybox
          cp "$TGT"/lib/ld-musl-aarch64.so.1 /tmp/s1/lib/ 2>/dev/null || true
          cat > /tmp/s1/init <<'INIT'
          #!/bin/busybox sh
          /bin/busybox --install -s /bin
          mount -t proc proc /proc 2>/dev/null
          mount -t sysfs sysfs /sys 2>/dev/null
          mount -t devtmpfs devtmpfs /dev 2>/dev/null
          echo "=== Jiyun A10 OpenWrt stage-1 initramfs ==="
          echo "=== type 'exit' to power off ==="
          exec /bin/busybox sh
          INIT
          chmod +x /tmp/s1/init
          ( cd /tmp/s1 && find . -print0 | cpio --null -o -H newc --owner=0:0 2>/dev/null | gzip -9 > /tmp/initramfs.gz )
          ls -l /tmp/initramfs.gz

          # ---- FIT (Rockchip placeholder load addresses, resolved by the
          #      stock u-boot exactly like it does for the original kernel) ----
          cat > /tmp/jiyun.its <<'ITS'
          /dts-v1/;
          / {
              description = "Jiyun A10 OpenWrt FIT";
              #address-cells = <1>;

              images {
                  kernel {
                      description = "Linux kernel";
                      data = /incbin/("/tmp/Image.lzma");
                      type = "kernel";
                      arch = "arm64";
                      os = "linux";
                      compression = "lzma";
                      entry = <0xffffff01>;
                      load = <0xffffff01>;
                      hash { algo = "sha256"; };
                  };
                  fdt {
                      description = "Device Tree Blob";
                      data = /incbin/("/tmp/rockchip.dtb");
                      type = "flat_dt";
                      arch = "arm64";
                      compression = "none";
                      load = <0xffffff00>;
                      hash { algo = "sha256"; };
                  };
                  ramdisk {
                      description = "OpenWrt stage-1 initramfs";
                      data = /incbin/("/tmp/initramfs.gz");
                      type = "ramdisk";
                      arch = "arm64";
                      os = "linux";
                      compression = "gzip";
                      load = <0xffffff02>;
                      hash { algo = "sha256"; };
                  };
              };

              configurations {
                  default = "conf";
                  conf {
                      description = "OpenWrt Jiyun A10 stage-1";
                      kernel = "kernel";
                      fdt = "fdt";
                      ramdisk = "ramdisk";
                      hash { algo = "sha256"; };
                  };
              };
          };
          ITS
          mkimage -f /tmp/jiyun.its /tmp/jiyun-a10-openwrt.fit
          ls -l /tmp/jiyun-a10-openwrt.fit
          dumpimage -l /tmp/jiyun-a10-openwrt.fit || true

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p output
          find lede/bin/targets -type f \
            \( -name "*jiyun*" -o -name "*.manifest" -o -name "sha256sums" \
               -o -name "packages.tar" -o -name "*.config" \) \
            -exec cp -v {} output/ \; || true
          cp -v /tmp/jiyun-a10-openwrt.fit output/ || true
          cp -v /tmp/rockchip.dtb output/ || true
          ls -al output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jiyun-a10-openwrt
          path: output
          retention-days: 30
          if-no-files-found: warn
